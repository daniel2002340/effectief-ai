packages:
  - apps/*
  - packages/*

# Eén versie van React en TypeScript in de hele workspace (zie docs/decisions.md #012).
catalog:
  "@types/node": ^24.19.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  ioredis: 5.11.1
  pino: 10.4.0
  react: 19.3.0
  react-dom: 19.3.0
  typescript: 6.0.3
  vite: 8.3.2
  vitest: 5.0.3
  zod: 4.6.5

onlyBuiltDependencies:
  - esbuild
  - lefthook

# Optional native speed-up for BullMQ's msgpack; the bundled worker uses the JS fallback.
ignoredBuiltDependencies:
  - msgpackr-extract
  # Its binary comes from a platform package (optionalDependencies); the postinstall is a fallback download.
  - "@sentry/cli"
