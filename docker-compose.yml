# Alleen voor lokale ontwikkeling en tests. Wachtwoorden hier zijn geen secrets.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: effectief
      POSTGRES_PASSWORD: effectief
      POSTGRES_DB: effectief
    ports:
      - "5442:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U effectief"]
      interval: 2s
      timeout: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6389:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
